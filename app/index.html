<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Navigator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <!-- A sibling of #map, not inside it, so clicks and scrolling here never reach the map. -->
  <div id="search-panel">
    <select id="campus-select" aria-label="Campus" hidden></select>
    <!-- One end of the route each: a place box and, for a building with an indoor map, a room box under it
         (shown once such a building is picked). The two ends are built by the same code (makeEndpoint). -->
    <div class="ends">
    <div class="endpoint" id="from-endpoint">
      <input id="from-input" class="place-input" type="search" placeholder="From: click the map, or search"
             aria-label="Start: search buildings and places" autocomplete="off">
      <ul id="from-results" class="search-results" hidden></ul>
      <div id="from-room-box" class="room-box" hidden>
        <input id="from-room-input" class="place-input room-input" type="search" placeholder="Search rooms"
               aria-label="Search rooms" autocomplete="off">
        <ul id="from-room-results" class="search-results" hidden></ul>
      </div>
      <!-- A point start inside a building with an indoor map: offer its rooms (GPS has no floor). -->
      <div id="inside-prompt" class="inside-prompt" hidden>
        <span class="inside-text"></span>
        <button id="inside-pick" type="button">Pick a room</button>
        <button id="inside-dismiss" type="button" aria-label="Dismiss">×</button>
      </div>
      <!-- on the line between From and To, wherever From ends (its room box or results may be open) -->
      <button id="swap-button" type="button" aria-label="Swap start and destination" disabled>⇅</button>
    </div>
    <div class="endpoint" id="to-endpoint">
      <input id="to-input" class="place-input" type="search" placeholder="To: search buildings and places"
             aria-label="Destination: search buildings and places" autocomplete="off">
      <ul id="to-results" class="search-results" hidden></ul>
      <div id="to-room-box" class="room-box" hidden>
        <input id="to-room-input" class="place-input room-input" type="search" placeholder="Search rooms"
               aria-label="Search rooms" autocomplete="off">
        <ul id="to-room-results" class="search-results" hidden></ul>
      </div>
    </div>
    </div>
    <!-- values must be keys of MODES in server/query.py -->
    <fieldset id="mode-toggle">
      <legend>Travel mode</legend>
      <label><input type="radio" name="mode" value="walk" checked><span>Walk</span></label>
      <label><input type="radio" name="mode" value="wheelchair"><span>Wheelchair</span></label>
    </fieldset>
    <div id="route-info" hidden></div>
  </div>
  <div id="status" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="main.js"></script>
</body>
</html>
