<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Navigator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <!-- A sibling of #map, not inside it, so clicks and scrolling here never reach the map. -->
  <div id="search-panel">
    <input id="search-input" type="search" placeholder="Search buildings and places"
           aria-label="Search buildings and places" autocomplete="off">
    <!-- values must be keys of MODES in server/query.py -->
    <fieldset id="mode-toggle">
      <legend>Travel mode</legend>
      <label><input type="radio" name="mode" value="walk" checked><span>Walk</span></label>
      <label><input type="radio" name="mode" value="wheelchair"><span>Wheelchair</span></label>
    </fieldset>
    <ul id="search-results" hidden></ul>
    <div id="route-info" hidden></div>
  </div>
  <div id="status" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="main.js"></script>
</body>
</html>
